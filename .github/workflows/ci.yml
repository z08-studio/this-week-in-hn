name: Newsletter workflow checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check Bash syntax
        run: bash -n scripts/newsletter.sh
      - name: Test draft and archive workflow
        run: python3 -B -m unittest discover -s tests -v
